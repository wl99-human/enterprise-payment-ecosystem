apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecosystem-ingress
  namespace: payments-ecosystem
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: payments.local
      http:
        paths:
          - path: /api/v1/payments
            pathType: Prefix
            backend:
              service:
                name: ingestion-service
                port:
                  number: 8080
          - path: /api/v1/ledger
            pathType: Prefix
            backend:
              service:
                name: ledger-service
                port:
                  number: 8081
          - path: /api/v1/notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8082
          - path: /api/v1/analytics
            pathType: Prefix
            backend:
              service:
                name: analytics-cqrs-service
                port:
                  number: 8083
          - path: /api/v1/accounts
            pathType: Prefix
            backend:
              service:
                name: analytics-cqrs-service
                port:
                  number: 8083
          - path: /api/v1/metrics
            pathType: Prefix
            backend:
              service:
                name: analytics-cqrs-service
                port:
                  number: 8083
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingestion-hpa
  namespace: payments-ecosystem
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ingestion-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
